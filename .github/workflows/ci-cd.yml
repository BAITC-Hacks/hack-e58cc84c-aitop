name: CI/CD

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Check and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run unit tests
        shell: bash
        run: |
          if [[ -d tests ]]; then
            python -m unittest discover --start-directory tests --verbose
          else
            echo "::notice::Directory tests/ does not exist yet; no unit tests were run."
          fi

  delivery:
    name: Build delivery artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare application files
        shell: bash
        run: |
          mkdir -p dist
          for file in main.py matcher.py faq.txt README.md; do
            if [[ -f "$file" ]]; then
              cp "$file" dist/
            fi
          done

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: faq-bot-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
